# Crucible Arena — self-owned, INTENTIONALLY VULNERABLE practice targets.
#
# The subnet below is the single source of truth the MCP allowlist must match
# (mcp-server/src/policy/networkPolicy.ts -> ARENA_CIDRS_V4). Keep them in sync.
#
# `internal: true` means the arena network has NO external egress. The MCP server / TrueForge
# sandbox must attach to this same network to reach the targets; restricting the sandbox to
# this network is Layer 1 of the security boundary (see docs/SECURITY_MODEL.md).
name: crucible-arena

services:
  web-01:
    build: ./web-01
    container_name: crucible-web-01
    networks:
      arena:
        ipv4_address: 10.42.0.5
    # Readiness: lets `docker compose up --wait` block until Flask is actually serving, so the
    # verifier never races service startup. Uses python (already in the image) — no curl needed.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:5000/challenge.json', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    # No host port publishing by default: reachable only on the internal arena network.
    # Uncomment ONLY for local dev if you must hit it from the host:
    # ports: ["5000:5000"]

  # crypto-01 / forensics-01 go here later (secondary, optional).

  # Crucible MCP server — the ONLY sanctioned path from the agent to the arena.
  # It sits on TWO networks by design:
  #   - `arena`  (internal, no egress): to reach web-01 by hostname/IP so `connect` works.
  #   - `edge`   (normal bridge): so TrueForge on the host can reach its Streamable HTTP endpoint
  #              (TrueForge registers only *remote* MCP servers via URL).
  # This is safe: the MCP server is trusted enforcement code (Layer 2, the allowlist). The thing
  # that must stay egress-contained is the agent's SANDBOX (Layer 1), not this server. `connect`
  # still refuses any destination outside the arena subnet, in code, fail-closed.
  mcp:
    build: ../mcp-server
    container_name: crucible-mcp
    networks: [arena, edge]
    ports: ["8848:8848"]        # http://localhost:8848/mcp — register this URL in TrueForge
    environment:
      CRUCIBLE_MCP_PORT: "8848"
      CRUCIBLE_MCP_PATH: "/mcp"
    depends_on:
      web-01:
        condition: service_healthy

networks:
  arena:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.42.0.0/24
  edge:
    driver: bridge   # host-reachable; carries only the MCP HTTP endpoint to TrueForge
